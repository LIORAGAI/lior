name: Build Meeting Summary installer

on:
  push:
    paths:
      - "meeting_summary_app/**"
      - ".github/workflows/build-meeting-summary.yml"
    tags:
      - "meeting-summary-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: meeting_summary_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # מנוע הפעלה (bootloader) שנבנה מקוד מקור ולא הגרסה הסטנדרטית - מפחית זיהוי שגוי של אנטי-וירוס
          $env:PYINSTALLER_COMPILE_BOOTLOADER = "1"
          python -m pip install --no-binary pyinstaller pyinstaller
          $boot = python -c "import PyInstaller, pathlib; print(pathlib.Path(PyInstaller.__file__).parent / 'bootloader/Windows-64bit-intel/run.exe')"
          if (-not (Test-Path $boot)) { throw "bootloader build failed" }
          Get-FileHash $boot

      - name: Build program folder
        working-directory: meeting_summary_app/packaging
        run: python -m PyInstaller --noconfirm --distpath ..\dist --workpath ..\build MeetingSummary.spec

      - name: Self-test packaged program
        run: |
          .\dist\MeetingSummary\MeetingSummary.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest failed" }

      - name: Test watch mode and scheduled task
        run: |
          $env:OneDrive = "$env:RUNNER_TEMP\od"
          .\dist\MeetingSummary\MeetingSummary.exe --install-watch
          if ($LASTEXITCODE -ne 0) { throw "install-watch failed" }
          $task = schtasks /Query /TN "MeetingSummary OneDrive Watch" /V /FO LIST | Out-String
          if ($LASTEXITCODE -ne 0) { throw "scheduled task not found" }
          $task
          if ($task -notmatch "30 Minute") { throw "task does not repeat every 30 minutes" }
          if ($task -notmatch "8:00:00") { throw "task does not start at 08:00" }
          Start-Process -Wait .\dist\MeetingSummary\MeetingSummaryWatch.exe -ArgumentList "--watch"
          if (-not (Test-Path "$env:LOCALAPPDATA\MeetingSummary\watch.log")) { throw "watch log missing" }
          if (-not (Get-ChildItem "$env:OneDrive" -Recurse -Directory | Where-Object Name -eq "הקלטות לסיכום")) { throw "watch folder missing" }
          .\dist\MeetingSummary\MeetingSummary.exe --remove-watch
          schtasks /Query /TN "MeetingSummary OneDrive Watch" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "scheduled task not removed" }
          $global:LASTEXITCODE = 0

      - name: Build installer
        run: |
          $version = (.\dist\MeetingSummary\MeetingSummary.exe --version).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /DMyAppVersion=$version packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingSummary-Setup
          path: meeting_summary_app/dist/MeetingSummary-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meeting-summary-v${{ env.VERSION }}
          name: סיכום ישיבה ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: meeting_summary_app/dist/MeetingSummary-Setup-*.exe
